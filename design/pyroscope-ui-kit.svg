<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<defs><style>
.bg{fill:#0b1117}.panel{fill:#111a23;stroke:#263442;stroke-width:1.5}.raised{fill:#151f2a;stroke:#263442;stroke-width:1.5}
.title{font:700 34px Inter,Arial,sans-serif;fill:#edf4f7}.h2{font:700 18px Inter,Arial,sans-serif;fill:#edf4f7}.body{font:14px Inter,Arial,sans-serif;fill:#edf4f7}.small{font:12px Inter,Arial,sans-serif;fill:#91a3b2}.label{font:700 11px Inter,Arial,sans-serif;letter-spacing:1.3px;fill:#91a3b2}
</style></defs>
<rect class="bg" width="1440" height="1000"/>
<text x="56" y="62" class="label">PYROSCOPE / DIP-10 DESIGN SYSTEM</text><text x="56" y="112" class="title">Wildfire Event Intelligence</text><text x="56" y="143" class="small">UI Kit reference board · dark geospatial monitoring interface</text>
<text x="56" y="205" class="h2">01 / Color tokens</text>
<g transform="translate(56 228)">
<rect width="190" height="90" rx="12" fill="#0b1117" stroke="#263442"/><text x="14" y="116" class="body">Background</text><text x="14" y="137" class="small">#0B1117</text>
<rect x="210" width="190" height="90" rx="12" fill="#111a23" stroke="#263442"/><text x="224" y="116" class="body">Surface</text><text x="224" y="137" class="small">#111A23</text>
<rect x="420" width="190" height="90" rx="12" fill="#ff784f"/><text x="434" y="116" class="body">High priority</text><text x="434" y="137" class="small">#FF784F</text>
<rect x="630" width="190" height="90" rx="12" fill="#ffbf69"/><text x="644" y="116" class="body">Medium priority</text><text x="644" y="137" class="small">#FFBF69</text>
<rect x="840" width="190" height="90" rx="12" fill="#6cb8ff"/><text x="854" y="116" class="body">Low priority</text><text x="854" y="137" class="small">#6CB8FF</text>
<rect x="1050" width="190" height="90" rx="12" fill="#67d5a5"/><text x="1064" y="116" class="body">Success / ready</text><text x="1064" y="137" class="small">#67D5A5</text></g>
<text x="56" y="415" class="h2">02 / Type scale</text><rect x="56" y="435" width="600" height="205" rx="16" class="panel"/>
<text x="82" y="480" class="title" style="font-size:28px">Dashboard title</text><text x="82" y="519" class="h2">Panel heading / semibold</text><text x="82" y="552" class="body">Body text — clear, concise, readable.</text><text x="82" y="581" class="small">Metadata · timestamps · secondary labels</text><text x="82" y="612" class="label">UPPERCASE EYEBROW / 11 PX</text>
<text x="710" y="415" class="h2">03 / Controls & status</text><rect x="710" y="435" width="674" height="205" rx="16" class="panel"/>
<rect x="738" y="466" width="170" height="42" rx="9" fill="#ff784f"/><text x="760" y="492" class="body" style="fill:#1d1714;font-weight:700">Primary action</text>
<rect x="926" y="466" width="150" height="42" rx="9" fill="#17232e" stroke="#263442"/><text x="952" y="492" class="body">Secondary</text>
<rect x="1095" y="466" width="90" height="30" rx="6" fill="#42251f"/><text x="1110" y="486" class="small" style="fill:#ff9b7d;font-weight:700">HIGH</text>
<rect x="1196" y="466" width="104" height="30" rx="6" fill="#38301e"/><text x="1207" y="486" class="small" style="fill:#ffcf7b;font-weight:700">MEDIUM</text>
<rect x="738" y="535" width="260" height="44" rx="9" fill="#0d151d" stroke="#2b3b48"/><text x="754" y="562" class="small">Search events…</text>
<rect x="1014" y="535" width="170" height="44" rx="9" fill="#0d151d" stroke="#2b3b48"/><text x="1030" y="562" class="body">All sources ▾</text>
<text x="56" y="700" class="h2">04 / Event card concept</text><rect x="56" y="722" width="400" height="220" rx="16" class="panel"/><circle cx="92" cy="763" r="13" fill="#38241f"/><text x="84" y="769" class="body" style="fill:#ff9a73">♨</text><text x="118" y="761" class="h2">Northern California</text><text x="118" y="783" class="small">VIIRS + MODIS · candidate cluster</text><rect x="330" y="745" width="88" height="26" rx="6" fill="#42251f"/><text x="347" y="762" class="small" style="fill:#ff9b7d;font-weight:700">HIGH</text><path d="M80 812H430" stroke="#263442"/><text x="80" y="840" class="small">Confidence estimate</text><text x="80" y="871" class="title" style="font-size:26px">91%</text><text x="245" y="840" class="small">Thermal detections</text><text x="245" y="871" class="title" style="font-size:26px">186</text><text x="80" y="914" class="small">Candidate only — verify before interpretation.</text>
<rect x="490" y="722" width="894" height="220" rx="16" class="panel"/><text x="520" y="762" class="h2">Design principles</text><text x="520" y="798" class="body">• Severity always uses color + text label</text><text x="520" y="830" class="body">• Clear hierarchy, compact metadata and consistent spacing</text><text x="520" y="862" class="body">• Keyboard-operable controls and visible focus states</text><text x="520" y="894" class="body">• Satellite thermal anomalies are not verified wildfire incidents</text>
</svg>